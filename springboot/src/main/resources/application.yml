server:
  port: ${SERVER_PORT:9090}

spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    # 敏感配置都可以用环境变量覆盖，生产环境不要使用默认值
    url: ${DB_URL:jdbc:postgresql://localhost:5432/gogoshop}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:123456}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  jackson:
    time-zone: GMT+8
    default-property-inclusion: non_null

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.example.entity
  configuration:
    map-underscore-to-camel-case: true

pagehelper:
  helper-dialect: postgresql
  reasonable: true
  support-methods-arguments: true
  params: count=countSql

gogoshop:
  jwt:
    # 生产环境务必通过 JWT_SECRET 环境变量设置一个足够长的随机字符串
    secret: ${JWT_SECRET:gogoshop-dev-secret-please-change-me-0123456789}
    expire-hours: 2
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:8080,http://127.0.0.1:8080}
  file:
    # 上传目录；为空时自动查找项目根目录下的 files 文件夹
    upload-dir: ${FILE_UPLOAD_DIR:}
    # 返回给前端的文件访问前缀
    base-url: ${FILE_BASE_URL:http://localhost:9090}
    allowed-extensions: jpg,jpeg,png,gif,webp,bmp
  login:
    max-failures: 5
    lock-minutes: 10

logging:
  level:
    com.example.mapper: info

---
# 开发环境：打印 SQL。启动参数 --spring.profiles.active=dev
spring:
  config:
    activate:
      on-profile: dev
logging:
  level:
    com.example.mapper: debug
